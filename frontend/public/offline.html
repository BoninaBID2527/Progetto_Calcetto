<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#090D0C" />
    <title>BONMATCH · Sei offline</title>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #090D0C; color: #F4F8F2; font: 16px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif; text-align: center; }
      main { max-width: 420px; display: grid; gap: 16px; justify-items: center; }
      h1 { margin: 0; font-size: 2rem; text-transform: uppercase; letter-spacing: 0.02em; }
      p { margin: 0; color: #A7B5AC; }
      button { min-height: 48px; padding: 0 24px; border: 0; border-radius: 14px; background: #C7FF36; color: #090D0C; font: inherit; font-weight: 700; cursor: pointer; }
      button:focus-visible { outline: 3px solid #F4F8F2; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" width="72" height="72" alt="" />
      <h1>Sei fuori dal campo</h1>
      <p>Non c'è connessione. Le partite, la chat e le classifiche arrivano dal server: appena torni online si aggiorna tutto da solo.</p>
      <button type="button" onclick="location.reload()">Riprova</button>
    </main>
    <script>
      window.addEventListener('online', () => location.reload());
    </script>
  </body>
</html>
